<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAB STEEL — Your Roof Deserves The Best</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cab-red: #A81B22;
      --cab-charcoal: #18181A;
    }

    body {
      margin: 0;
      background-color: #DCDCDC;
      color: var(--cab-charcoal);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Exact font from the brochure crop: Barlow Condensed Black */
    .font-brochure {
      font-family: 'Barlow Condensed', Impact, sans-serif;
      letter-spacing: 0.01em;
    }

    /* Hollow Red text for "THE BEST" */
    .outline-red {
      color: transparent;
      -webkit-text-stroke: 2.2px #A81B22;
      letter-spacing: 0.02em;
    }

    /* Soft continuous studio backdrop vignette */
    .studio-ambient-vignette {
      pointer-events-none;
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 90% 70% at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.12) 100%);
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body class="antialiased selection:bg-[#A81B22] selection:text-white">

  <!-- SCROLL-TRIGGERED HERO SECTION (400vh scroll track for 239 pristine 1080p frames) -->
  <div id="heroScrollTrack" class="relative w-full h-[400vh]">
    
    <!-- Sticky Fullscreen Viewport -->
    <section class="sticky top-0 left-0 w-full h-screen overflow-hidden flex flex-col justify-between">
      
      <!-- Fullscreen Frame-Sequence Canvas -->
      <canvas
        id="roofSequenceCanvas"
        class="absolute inset-0 w-full h-full z-0 pointer-events-none"
      ></canvas>

      <!-- Soft seamless studio ambient lighting -->
      <div class="studio-ambient-vignette z-[4]"></div>

      <!-- TOP NAVIGATION BAR -->
      <header class="relative z-20 w-full px-6 sm:px-12 lg:px-16 pt-6 flex items-center justify-between">
        <!-- Left: Official Complete CAB STEEL Logo -->
        <a href="#" class="flex items-center">
          <img
            src="./images/cabsteel-logo.png"
            alt="CAB STEEL Metal Fabrication"
            class="h-14 sm:h-16 w-auto object-contain block"
          />
        </a>

        <!-- Right: Modern Uppercase Links + "GET A QUOTE" Button -->
        <nav class="flex items-center gap-6 sm:gap-9 text-xs sm:text-[13px] font-extrabold uppercase tracking-wider text-[#18181A]">
          <a href="#" class="hidden md:inline-block hover:text-[#A81B22] transition-colors">HOME</a>
          <a href="#" class="hidden md:inline-block hover:text-[#A81B22] transition-colors">ABOUT US</a>
          <a href="#" class="hidden md:inline-block hover:text-[#A81B22] transition-colors">WHY US?</a>
          <a href="#" class="hidden md:inline-block hover:text-[#A81B22] transition-colors">PRODUCTS</a>
          <a
            href="tel:09184080396"
            class="px-6 py-2.5 rounded-full bg-[#A81B22] text-white text-xs sm:text-[13px] font-black uppercase hover:bg-[#8c141a] shadow-sm transition-all"
          >
            GET A QUOTE
          </a>
        </nav>
      </header>

      <!-- HEADLINE MATCHING BROCHURE FONT WITH HOLLOW RED "THE BEST" -->
      <div
        id="heroHeadlineBlock"
        class="relative z-10 w-full px-4 text-center mt-6 sm:mt-10 lg:mt-12 pointer-events-none select-none transition-opacity duration-300"
      >
        <h1 class="font-brochure font-black text-6xl sm:text-8xl lg:text-[104px] uppercase tracking-tight leading-[0.92] text-[#18181A]">
          YOUR ROOF DESERVES <span class="outline-red ml-1 sm:ml-2">THE BEST</span>
        </h1>
      </div>

      <!-- Spacious Gap between Headline and Floating Roof -->
      <div class="flex-1"></div>

      <!-- BOTTOM CENTER DYNAMIC SCROLL PROGRESS BAR -->
      <div class="relative z-20 pb-8 flex items-center justify-center select-none">
        <div class="w-36 sm:w-44 h-[3px] bg-black/15 rounded-full overflow-hidden">
          <div id="scrollProgressBar" class="h-full w-0 bg-[#A81B22] transition-all duration-75 rounded-full"></div>
        </div>
      </div>

    </section>
  </div>

  <script>
    // =========================================================================
    // SCROLL-TRIGGERED 239-FRAME LOSSLESS 1080P PNG SEQUENCE ENGINE
    // =========================================================================
    const TOTAL_FRAMES = 239;
    const canvas = document.getElementById('roofSequenceCanvas');
    const ctx = canvas.getContext('2d');
    const scrollTrack = document.getElementById('heroScrollTrack');
    const progressBar = document.getElementById('scrollProgressBar');

    const images = new Array(TOTAL_FRAMES);
    let targetFrame = 0;
    let currentFrame = 0;

    function getFramePath(index) {
      const frameNum = String(index + 1).padStart(4, '0');
      // 100% uncompressed lossless PNG directly from the 1080p source video
      return `./ezgif-8e1e996d95d816b7-jpg/frame-${frameNum}.png`;
    }

    function drawFrameSpacious(img) {
      if (!img || !img.complete || img.naturalWidth === 0) return;

      const cw = canvas.width;
      const ch = canvas.height;
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;

      const scale = Math.max(cw / iw, ch / ih);
      const sw = iw * scale;
      const sh = ih * scale;
      const sx = (cw - sw) / 2;

      // Lowered stage (ch * 0.13) gives generous clearance under the large headline
      const verticalOffset = ch * 0.13;
      const sy = (ch - sh) / 2 + verticalOffset;

      if (sy > 0) {
        ctx.drawImage(img, 0, 0, iw, 4, sx, 0, sw, sy + 2);
      }

      ctx.drawImage(img, 0, 0, iw, ih, sx, sy, sw, sh);
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      drawFrameSpacious(images[Math.round(currentFrame)] || images[0]);
    }

    window.addEventListener('resize', resizeCanvas);

    // Preload all 239 lossless frames
    for (let i = 0; i < TOTAL_FRAMES; i++) {
      const img = new Image();
      img.src = getFramePath(i);
      if (i === 0) {
        img.onload = () => {
          resizeCanvas();
        };
      }
      images[i] = img;
    }

    // Update target frame index and bottom progress bar from scroll position
    window.addEventListener(
      'scroll',
      () => {
        const maxScroll = scrollTrack.offsetHeight - window.innerHeight;
        const scrollFraction = Math.max(0, Math.min(1, window.scrollY / maxScroll));
        targetFrame = scrollFraction * (TOTAL_FRAMES - 1);

        // Update bottom progress indicator
        const pct = Math.round(scrollFraction * 100);
        if (progressBar) progressBar.style.width = pct + '%';
      },
      { passive: true }
    );

    // Smooth 60fps interpolation loop
    function tick() {
      currentFrame += (targetFrame - currentFrame) * 0.16;
      const frameIndex = Math.max(0, Math.min(TOTAL_FRAMES - 1, Math.round(currentFrame)));
      const frameImg = images[frameIndex];
      if (frameImg && frameImg.complete) {
        drawFrameSpacious(frameImg);
      }
      requestAnimationFrame(tick);
    }

    resizeCanvas();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
